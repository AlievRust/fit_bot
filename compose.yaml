services:
  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/gymbot.sqlite3
    volumes:
      - bot_data:/app/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

volumes:
  bot_data:
